name: run_semi
description: Programme d'entraînement semi-marathon
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  flutter_tts: ^4.0.2
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  health: ^10.2.0
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  package_info_plus: ^9.0.1
  liquid_glass_renderer: ^0.2.0-dev.4
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
    - assets/google_fonts/
    - assets/animations/run/


